name: House PDF.js security remediation temporary

on:
  push:
    branches: [feat/house-governanca-phase1]
    paths:
      - '.github/workflows/pdfjs-security-remediation-temp.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply isolated PDF.js remediation
        run: |
          npm install --save-exact pdfjs-dist@6.2.108
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdf.worker.min.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/cardapio/AbaCotacao.tsx')
          s=p.read_text()
          old="const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;"
          new="const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer), enableScripting: false }).promise;"
          if s.count(old) != 1:
              raise SystemExit(f'expected one PDF getDocument call, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify patched package, lock, worker and callsite
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json');
          const lock=require('./package-lock.json');
          if(pkg.dependencies['pdfjs-dist']!=='6.2.108') throw new Error('package.json não está pinado em 6.2.108');
          if(lock.packages[''].dependencies['pdfjs-dist']!=='6.2.108') throw new Error('lock root não está pinado');
          if(lock.packages['node_modules/pdfjs-dist']?.version!=='6.2.108') throw new Error('lock resolved != 6.2.108');
          const src=fs.readFileSync('src/components/cardapio/AbaCotacao.tsx','utf8');
          if(!/getDocument\(\{\s*data:\s*new Uint8Array\(arrayBuffer\),\s*enableScripting:\s*false\s*\}\)/.test(src)) throw new Error('enableScripting:false ausente no fluxo real');
          if(!src.includes("GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs'")) throw new Error('worker local esperado ausente');
          console.log('PDFJS_CALLSITE_HARDENING=PASS');
          NODE
          node -e "import('pdfjs-dist').then(m=>{if(m.version!=='6.2.108')throw new Error('runtime '+m.version);console.log('PDFJS_RUNTIME_VERSION=PASS',m.version)})"
          cmp -s public/pdf.worker.min.mjs node_modules/pdfjs-dist/build/pdf.worker.min.mjs
          echo PDFJS_WORKER_MATCH=PASS

      - name: Verify advisory is absent from npm audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const audit=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const pdf=audit.vulnerabilities && audit.vulnerabilities['pdfjs-dist'];
          if(pdf) throw new Error('pdfjs-dist ainda aparece no npm audit: '+JSON.stringify(pdf));
          console.log('PDFJS_NPM_AUDIT=PASS');
          console.log('NPM_AUDIT_TOTALS='+JSON.stringify(audit.metadata?.vulnerabilities||{}));
          NODE

      - name: Run House test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare exact-origin PDF browser proof
        run: |
          mkdir -p /tmp/pdfjs-proof
          cd /tmp/pdfjs-proof
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          objects=[]
          objects.append('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n')
          objects.append('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n')
          objects.append('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>\nendobj\n')
          objects.append('4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n')
          stream='BT\n/F1 18 Tf\n72 720 Td\n(PDF SEGURANCA OK) Tj\nET\n'
          objects.append(f'5 0 obj\n<< /Length {len(stream.encode())} >>\nstream\n{stream}endstream\nendobj\n')
          out=bytearray(b'%PDF-1.4\n')
          offsets=[0]
          for obj in objects:
              offsets.append(len(out)); out.extend(obj.encode())
          xref=len(out)
          out.extend(f'xref\n0 {len(objects)+1}\n'.encode())
          out.extend(b'0000000000 65535 f \n')
          for off in offsets[1:]: out.extend(f'{off:010d} 00000 n \n'.encode())
          out.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('/tmp/pdfjs-proof/sample.pdf').write_bytes(out)
          PY

          cat > /tmp/pdfjs-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tata-house.github.io
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/pdfjs-key.pem -out /tmp/pdfjs-cert.pem -config /tmp/pdfjs-cert.cnf >/dev/null 2>&1

          cat > /tmp/pdfjs-proof/server.cjs <<'NODE'
          const https=require('https'),fs=require('fs'),path=require('path');
          const root=process.env.GITHUB_WORKSPACE;
          const html=`<!doctype html><meta charset="utf-8"><title>PDF.js security proof</title>
          <input id="file" type="file" accept="application/pdf"><pre id="result">WAIT</pre>
          <script type="module">
          import * as pdfjsLib from '/pdf.mjs';
          window.__PDFJS_VERSION=pdfjsLib.version;
          pdfjsLib.GlobalWorkerOptions.workerSrc='/pdf.worker.min.mjs';
          document.getElementById('file').addEventListener('change',async(e)=>{
            try{
              const file=e.target.files[0];
              const buffer=await file.arrayBuffer();
              const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buffer),enableScripting:false}).promise;
              const texts=[];
              for(let i=1;i<=pdf.numPages;i++){
                const page=await pdf.getPage(i); const content=await page.getTextContent();
                texts.push(content.items.map(it=>'str' in it?it.str:'').join(' '));
              }
              document.getElementById('result').textContent=texts.join('\n');
              window.__PDF_PROOF={ok:true,numPages:pdf.numPages,version:pdfjsLib.version};
            }catch(err){document.getElementById('result').textContent='ERROR '+err;window.__PDF_PROOF={ok:false,error:String(err)}}
          });
          </script>`;
          function send(res,status,body,type){res.writeHead(status,{'content-type':type,'cache-control':'no-store'});res.end(body)}
          https.createServer({key:fs.readFileSync('/tmp/pdfjs-key.pem'),cert:fs.readFileSync('/tmp/pdfjs-cert.pem')},(req,res)=>{
            const p=new URL(req.url,'https://tata-house.github.io').pathname;
            if(p==='/'||p==='/pdf-proof.html')return send(res,200,html,'text/html; charset=utf-8');
            if(p==='/pdf.mjs')return fs.createReadStream(path.join(root,'node_modules/pdfjs-dist/build/pdf.mjs')).pipe((res.writeHead(200,{'content-type':'application/javascript','cache-control':'no-store'}),res));
            if(p==='/pdf.worker.min.mjs')return fs.createReadStream(path.join(root,'public/pdf.worker.min.mjs')).pipe((res.writeHead(200,{'content-type':'application/javascript','cache-control':'no-store'}),res));
            send(res,404,'not found','text/plain');
          }).listen(443,'0.0.0.0');
          NODE

          cat > /tmp/pdfjs-proof/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--host-resolver-rules=MAP tata-house.github.io 127.0.0.1','--no-proxy-server']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844}});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://tata-house.github.io/pdf-proof.html',{waitUntil:'domcontentloaded'});
            if(await page.evaluate(()=>window.__PDFJS_VERSION)!=='6.2.108')throw new Error('versão browser inesperada');
            await page.locator('#file').setInputFiles('/tmp/pdfjs-proof/sample.pdf');
            await page.waitForFunction(()=>window.__PDF_PROOF?.ok===true,null,{timeout:15000});
            const proof=await page.evaluate(()=>window.__PDF_PROOF);
            const text=(await page.locator('#result').textContent())||'';
            if(proof.version!=='6.2.108'||proof.numPages!==1||!text.includes('PDF SEGURANCA OK'))throw new Error('prova PDF inválida '+JSON.stringify({proof,text}));
            if(errors.length)throw new Error('page errors '+JSON.stringify(errors));
            console.log('PDFJS_BROWSER_TEXT_EXTRACTION=PASS');
            console.log('PDFJS_BROWSER_VERSION=PASS');
            console.log('PDFJS_BROWSER_WORKER=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/pdfjs-proof/server.cjs
          node --check /tmp/pdfjs-proof/test.cjs

      - name: Start exact-origin PDF proof server
        run: |
          sudo -E node /tmp/pdfjs-proof/server.cjs >/tmp/pdfjs-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve tata-house.github.io:443:127.0.0.1 -ksSf https://tata-house.github.io/pdf-proof.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pdfjs-server.log
          exit 1

      - name: Prove PDF extraction with patched runtime and worker
        run: cd /tmp/pdfjs-proof && node test.cjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit isolated security remediation
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add -- package.json package-lock.json public/pdf.worker.min.mjs src/components/cardapio/AbaCotacao.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): remediate PDF.js script execution advisory"
          git push origin HEAD:feat/house-governanca-phase1

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/house-governanca-phase1
            git reset --hard origin/feat/house-governanca-phase1
            if [ ! -f .github/workflows/pdfjs-security-remediation-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/pdfjs-security-remediation-temp.yml
            git commit -m "test(house): remove temporary PDF.js security remediation harness"
            if git push origin HEAD:feat/house-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
