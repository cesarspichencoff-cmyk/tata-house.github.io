name: TATÁ House cenários V2 E2E (temp)

on:
  push:
    branches:
      - feat/house-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-cenarios-v2-e2e-temp.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build current House feature
        run: npm ci && npm run build
      - uses: actions/checkout@v4
        with:
          repository: cesarspichencoff-cmyk/lideres
          ref: feat/tatahouse-governanca-phase1
          path: leaders
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/tatahouse-cenarios-e2e
          cd /tmp/tatahouse-cenarios-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Prepare exact-origin visual harness
        run: |
          cat > /tmp/tatahouse-cenarios-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tatahouse-cenarios-e2e
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          DNS.2=lideres.tatasushi.tech
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/tatahouse-cenarios-key.pem -out /tmp/tatahouse-cenarios-cert.pem -config /tmp/tatahouse-cenarios-cert.cnf >/dev/null 2>&1
          cat > /tmp/tatahouse-cenarios-e2e.cjs <<'NODE'
          const https=require('https'),fs=require('fs'),path=require('path');
          const mode=process.argv[2],root=process.env.GITHUB_WORKSPACE;
          const houseRoot=path.join(root,'out'), leadersRoot=path.join(root,'leaders');
          const HOUSE='https://tata-house.github.io';
          const harness=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;min-height:100%;font-family:system-ui}iframe{display:block;width:100%;height:100vh;border:0}</style></head><body>
          <script src="/compliance/kpis/tatahouse/house_governanca_planejador_v1.js"><\/script>
          <iframe id="house" src="${HOUSE}/planejar.html" title="Planejador TATÁ House"></iframe>
          <script>
          (function(){
            window.__statuses=[]; window.__draft=null;
            var api=window.TataHouseGovernancaPlanejadorV1;
            var frame=document.getElementById('house');
            var ctx=api.criarContexto({semanaId:'2026-S37',unidadeFonte:'Itaim'});
            window.__ctx=ctx;
            window.__disconnect=api.conectarIframe(frame,ctx,{
              aoStatus:function(s,p){window.__statuses.push({s:s,p:p||null});},
              aoDraft:function(r){window.__draft=r;}
            });
          })();
          <\/script></body></html>`;
          function mime(f){if(f.endsWith('.html'))return'text/html; charset=utf-8';if(f.endsWith('.js')||f.endsWith('.mjs'))return'application/javascript; charset=utf-8';if(f.endsWith('.css'))return'text/css; charset=utf-8';if(f.endsWith('.json'))return'application/json';if(f.endsWith('.svg'))return'image/svg+xml';if(f.endsWith('.png'))return'image/png';if(f.endsWith('.webp'))return'image/webp';if(f.endsWith('.woff2'))return'font/woff2';return'application/octet-stream'}
          function send(res,c,b,t='text/plain; charset=utf-8'){res.writeHead(c,{'content-type':t,'cache-control':'no-store'});res.end(b)}
          function serve(res,base,p){let rel=decodeURIComponent(p);while(rel.startsWith('/'))rel=rel.slice(1);if(!rel)rel='index.html';if(rel.endsWith('/'))rel+='index.html';const br=path.resolve(base),f=path.resolve(base,rel);if(!f.startsWith(br+path.sep)&&f!==br)return send(res,403,'forbidden');try{if(!fs.statSync(f).isFile())return send(res,404,'not found');res.writeHead(200,{'content-type':mime(f),'cache-control':'no-store'});fs.createReadStream(f).pipe(res)}catch{return send(res,404,'not found')}}
          function server(){https.createServer({key:fs.readFileSync('/tmp/tatahouse-cenarios-key.pem'),cert:fs.readFileSync('/tmp/tatahouse-cenarios-cert.pem')},(req,res)=>{const host=(req.headers.host||'').split(':')[0],p=new URL(req.url,'https://'+host).pathname;if(host==='lideres.tatasushi.tech'){if(p==='/harness.html')return send(res,200,harness,'text/html; charset=utf-8');return serve(res,leadersRoot,p)}if(host==='tata-house.github.io')return serve(res,houseRoot,p);return send(res,421,'unknown host')}).listen(443,'0.0.0.0',()=>console.log('CENARIOS_E2E_SERVER=READY'))}
          async function test(){
            const {chromium}=require('/tmp/tatahouse-cenarios-e2e/node_modules/playwright');
            const browser=await chromium.launch({headless:true,args:['--host-resolver-rules=MAP tata-house.github.io 127.0.0.1, MAP lideres.tatasushi.tech 127.0.0.1','--no-proxy-server']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:1000},timezoneId:'America/Sao_Paulo'});
            await context.route('**/*',async route=>{
              const u=new URL(route.request().url());
              if(u.hostname==='tata-house.github.io'||u.hostname==='lideres.tatasushi.tech') return route.continue();
              return route.abort();
            });
            await context.addInitScript(()=>{
              if(location.hostname!=='tata-house.github.io') return;
              const pessoas=[55,55,65,65,80,80,80];
              const dias=pessoas.map(p=>({pessoas:p,principal:'',guarnicaoFixa:'Arroz e Feijão',guarnicao:'',salada:'',sobremesa:''}));
              const seed={versao:1,orcamento:4200,dias,etapa:'compras',historico:[{etapa:'cozinha',em:'2026-09-05T12:00:00.000Z',papel:'gestor'}],ajustes:{0:{sal:{qtd:1}}},manuais:{0:[{item:'Teste antigo',unid:'kg',qtd:1}]},status:{0:{sal:{compradoQtd:1}}},obsCozinha:'observação preservada',refeicoes:{0:52},notas:{0:'nota-antiga'},notasFiscais:[{foto:'data:image/png;base64,AA==',dias:[0],em:'2026-09-05T12:00:00.000Z'}]};
              localStorage.setItem('cardapio.v1.semana.2026-S37',JSON.stringify(seed));
            });
            const page=await context.newPage();
            await page.goto('https://lideres.tatasushi.tech/harness.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__statuses.some(x=>x.s==='contexto-confirmado'),null,{timeout:15000});
            console.log('CENARIOS_E2E_CONTEXT_ACK=PASS');
            const frame=page.frames().find(f=>f.url().startsWith('https://tata-house.github.io/planejar'));
            if(!frame)throw new Error('House planejar frame not found');
            await frame.getByTestId('comparador-cenarios').waitFor({state:'visible',timeout:15000});
            console.log('CENARIOS_E2E_VISUAL_SURFACE=PASS');
            await frame.getByTestId('gerar-cenarios').click();
            await frame.getByTestId('lista-cenarios').waitFor({state:'visible',timeout:20000});
            const cards=frame.locator('[data-testid^="cenario-"]');
            if(await cards.count()!==3)throw new Error('expected 3 scenarios, got '+await cards.count());
            for(const id of ['historico','equilibrado','criativo']){
              if(!(await frame.getByTestId('cenario-'+id).isVisible()))throw new Error('missing scenario '+id);
            }
            console.log('CENARIOS_E2E_THREE_STRATEGIES=PASS');
            const eq=frame.getByTestId('cenario-equilibrado');
            for(const label of ['Custo / refeição','Aceitação','Repetição recente','Regras','Nutrição','Cobertura de dados']){
              if(!(await eq.getByText(label,{exact:true}).isVisible()))throw new Error('missing metric '+label);
            }
            await eq.locator('summary').click();
            if(!(await eq.getByText(/motor multi-critério priorizou aceitação e diversidade/i).isVisible()))throw new Error('explainability absent');
            console.log('CENARIOS_E2E_EVIDENCE_EXPLAINABILITY=PASS');
            fs.mkdirSync('/tmp/tatahouse-cenarios-shots',{recursive:true});
            await page.screenshot({path:'/tmp/tatahouse-cenarios-shots/01-comparacao-desktop.png',fullPage:true});

            let escolhido=null;
            for(let i=0;i<await cards.count();i++){
              const t=await cards.nth(i).innerText();
              if(!/\d+ erro/.test(t)){escolhido=cards.nth(i);break;}
            }
            if(!escolhido)throw new Error('all generated scenarios have blocking errors');
            const testid=await escolhido.getAttribute('data-testid');
            const id=testid.replace('cenario-','');
            page.once('dialog',d=>d.accept());
            await frame.getByTestId('aplicar-'+id).click();
            await frame.waitForFunction(()=>/Cenário aplicado somente ao rascunho local/i.test(document.querySelector('[data-testid="mensagem-cenarios"]')?.textContent||''),null,{timeout:10000});
            const state=await frame.evaluate(()=>JSON.parse(localStorage.getItem('cardapio.v1.semana.2026-S37')||'null'));
            if(!state||state.dias.length!==7||state.dias.some(d=>!d.principal))throw new Error('applied draft invalid');
            if(Object.keys(state.ajustes||{}).length||Object.keys(state.manuais||{}).length||Object.keys(state.status||{}).length||state.refeicoes||state.notas||state.notasFiscais)throw new Error('derived operational state was not cleared');
            if(state.orcamento!==4200||state.historico.length!==1||state.obsCozinha!=='observação preservada')throw new Error('preserved fields drifted');
            console.log('CENARIOS_E2E_APPLY_DRAFT_CLEANS_DERIVATIVES=PASS '+id);

            const send=frame.getByRole('button',{name:'Enviar proposta'});
            if(await send.isDisabled())throw new Error('selected scenario remained blocked after apply');
            await send.click();
            await page.waitForFunction(()=>window.__draft&&window.__draft.dias&&window.__draft.dias.length===7,null,{timeout:10000});
            const draft=await page.evaluate(()=>window.__draft);
            if(draft.semanaId!=='2026-S37'||draft.unidadeFonte!=='Itaim'||draft.dias.some(d=>!d.principal))throw new Error('draft contract mismatch');
            await frame.getByText(/Rascunho recebido pela Governança/i).waitFor({state:'visible',timeout:10000});
            const receipt=await page.evaluate(()=>JSON.parse(localStorage.getItem('tata.governanca.planejamentos.v1')||'[]'));
            if(!Array.isArray(receipt)||receipt.length<1||receipt[0].proposalId!==draft.proposalId)throw new Error('governance receipt missing');
            console.log('CENARIOS_E2E_DRAFT_ACK_RECEIPT=PASS');

            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(250);
            const overflow=await frame.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            if(overflow>2)throw new Error('mobile horizontal overflow '+overflow);
            await page.screenshot({path:'/tmp/tatahouse-cenarios-shots/02-fluxo-mobile.png',fullPage:true});
            console.log('CENARIOS_E2E_MOBILE_NO_OVERFLOW=PASS');
            await browser.close();
            console.log('HOUSE_GOVERNANCA_CENARIOS_V2_E2E=PASS');
          }
          if(mode==='server')server();else if(mode==='test')test().catch(e=>{console.error(e);process.exit(1)});else process.exit(2);
          NODE
          node --check /tmp/tatahouse-cenarios-e2e.cjs
      - name: Start exact-origin harness
        run: |
          sudo -E node /tmp/tatahouse-cenarios-e2e.cjs server >/tmp/tatahouse-cenarios-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve lideres.tatasushi.tech:443:127.0.0.1 -ksSf https://lideres.tatasushi.tech/harness.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tatahouse-cenarios-server.log
          exit 1
      - name: Prove compare → choose → draft → ACK
        run: node /tmp/tatahouse-cenarios-e2e.cjs test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tatahouse-cenarios-v2-visual-proof
          path: /tmp/tatahouse-cenarios-shots/*.png
          if-no-files-found: ignore
