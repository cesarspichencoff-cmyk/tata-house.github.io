name: House runtime advisory relevance temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-runtime-advisory-relevance-temp.yml]
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove deployment shape and runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== NEXT CONFIG ==='
          cat next.config.mjs
          echo '=== MIDDLEWARE / SERVER FILES ==='
          find . -path './node_modules' -prune -o \( -name 'middleware.ts' -o -name 'middleware.js' -o -name 'middleware.mjs' -o -name 'middleware.cjs' \) -print | tee /tmp/middleware.txt
          echo '=== PDFJS SOURCE REFERENCES ==='
          grep -RInE 'pdfjs-dist|pdf\.worker|getDocument\(|GlobalWorkerOptions' src public scripts --exclude='pdf.worker.min.mjs' 2>/dev/null | tee /tmp/pdfjs-refs.txt || true
          echo '=== NEXT SERVER-ONLY PRIMITIVES ==='
          grep -RInE 'next/server|NextResponse|NextRequest|cookies\(|headers\(|server action|use server|rewrites\(|redirects\(' src next.config.mjs 2>/dev/null | tee /tmp/next-server-refs.txt || true
          echo '=== VITEST UI / SERVER REFERENCES ==='
          grep -RInE 'vitest.*ui|--ui|vitest/ui|@vitest/ui|vitest --ui' package.json .github src 2>/dev/null | tee /tmp/vitest-ui-refs.txt || true
          echo '=== PDF INPUT SURFACE ==='
          grep -RInE 'accept=.*pdf|application/pdf|\.pdf' src 2>/dev/null | tee /tmp/pdf-input-refs.txt || true
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8').trim().split('\n').filter(Boolean);
          const nextConfig=fs.readFileSync('next.config.mjs','utf8');
          const packageJson=JSON.parse(fs.readFileSync('package.json','utf8'));
          const result={
            staticExport:/output\s*:\s*["']export["']/.test(nextConfig),
            middlewareFiles:read('/tmp/middleware.txt'),
            pdfjsSourceRefs:read('/tmp/pdfjs-refs.txt'),
            nextServerRefs:read('/tmp/next-server-refs.txt'),
            vitestUiRefs:read('/tmp/vitest-ui-refs.txt'),
            pdfInputRefs:read('/tmp/pdf-input-refs.txt'),
            scripts:packageJson.scripts,
            pdfjsDeclared:!!packageJson.dependencies?.['pdfjs-dist'],
            vitestDeclared:!!packageJson.devDependencies?.vitest,
            nextDeclared:packageJson.dependencies?.next||null
          };
          fs.writeFileSync('/tmp/runtime-advisory-relevance.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(!result.staticExport) throw new Error('House is not static export');
          if(result.middlewareFiles.length) throw new Error('Middleware files found: '+result.middlewareFiles.join(','));
          if(result.vitestUiRefs.length) throw new Error('Vitest UI/server exposure found');
          NODE
      - name: Upload classification evidence
        uses: actions/upload-artifact@v4
        with:
          name: house-runtime-advisory-relevance
          path: /tmp/runtime-advisory-relevance.json
          retention-days: 7
      - name: Remove temporary relevance workflow
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-runtime-advisory-relevance-temp.yml
          git add .github/workflows/house-runtime-advisory-relevance-temp.yml
          git commit -m "audit(house): remove temporary runtime advisory relevance" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
