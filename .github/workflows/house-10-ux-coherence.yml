name: House 10 UX Coherence

on:
  push:
    branches:
      - feat/tata-house-10-10-ux-coherence-canonical-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply UX coherence patch
        run: python scripts/house10_ux_coherence_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified UX coherence patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx src/components/cardapio/AbaAgora.tsx src/lib/cardapio/ux-coerencia.test.ts
          if git diff --cached --quiet; then
            echo "No UX delta to persist"
            exit 0
          fi
          git commit -m "[house-patch] ux: consolida Inicio e torna relatorio vivo explicito"
          git push origin HEAD:feat/tata-house-10-10-ux-coherence-canonical-20260917
