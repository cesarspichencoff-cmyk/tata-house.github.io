name: House standalone export final proof temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-standalone-export-final-temp.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build exported House
        env:
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_URL: ''
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_KEY: ''
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_PUBLISHABLE_KEY: ''
        run: |
          npm ci
          npm run build
          test -f out/index.html
          test -f out/avaliar.html
          test -f out/planejar.html
      - name: Install Chromium
        run: |
          mkdir -p /tmp/house-final && cd /tmp/house-final
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve export
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/house-final.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/house-final.log; exit 1
      - name: Prove public routes and dormant integration
        run: |
          cat > /tmp/house-final/proof.cjs <<'NODE'
          const { chromium } = require('/tmp/house-final/node_modules/playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for (const path of ['/avaliar.html','/planejar.html']) {
                const context=await browser.newContext({viewport:{width:390,height:844}});
                const page=await context.newPage();
                const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                const r=await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                assert(r&&r.ok(),path+' não carregou');
                const state=await page.evaluate(()=>({
                  govLocal:Object.keys(localStorage).filter(k=>k.startsWith('tata.governanca.')),
                  govSession:Object.keys(sessionStorage).filter(k=>k.startsWith('tata.governanca.')),
                  width:{scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}
                }));
                assert(state.govLocal.length===0,path+' criou Governança local sem handoff '+JSON.stringify(state.govLocal));
                assert(state.govSession.length===0,path+' criou contexto Governança sem handoff '+JSON.stringify(state.govSession));
                assert(state.width.scroll<=state.width.client+2,path+' overflow mobile '+JSON.stringify(state.width));
                assert(errors.length===0,path+' pageerror '+errors.join(' | '));
                await context.close();
              }
              console.log('HOUSE_STANDALONE_PUBLIC_EXPORT=PASS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/house-final/proof.cjs
      - name: Diff hygiene
        run: git diff --check 6dc04827b195aaca9d4653618e5a40ca64a1a6f4...HEAD
      - name: Remove temporary final proof
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-standalone-export-final-temp.yml
          git add .github/workflows/house-standalone-export-final-temp.yml
          git commit -m "test(house): remove temporary standalone export final proof" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
