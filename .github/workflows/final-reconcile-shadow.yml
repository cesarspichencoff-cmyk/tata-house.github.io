name: Final Reconcile Shadow

on:
  push:
    branches:
      - feat/tata-house-final-reconciled-20260917
    paths:
      - scripts/reconcile_shadow_final.py
      - .github/workflows/final-reconcile-shadow.yml

permissions:
  contents: write

jobs:
  reconcile-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reconciliation
        run: python scripts/reconcile_shadow_final.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified reconciliation
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/cardapio/PlanejadorGovernanca.tsx src/lib/cardapio/governanca-shadow.ts src/lib/cardapio/use-semana-governanca-shadow.ts src/lib/cardapio/governanca-shadow.test.ts
          if git diff --cached --quiet; then
            echo "No reconciliation needed"
          else
            git commit -m "[house-final] fix(governanca): restaurar shadow isolation"
            git push
          fi
