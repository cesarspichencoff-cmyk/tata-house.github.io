name: House preservation audit temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-preservation-audit-temp.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove bounded outbox
        run: npx vitest run src/lib/cardapio/governanca-outbox.test.ts
      - name: Full tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build without integration backend
        env:
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_URL: ''
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_KEY: ''
          NEXT_PUBLIC_GOVERNANCA_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run build
      - name: Diff hygiene
        run: git diff --check 6dc04827b195aaca9d4653618e5a40ca64a1a6f4...HEAD
      - name: Remove temporary audit workflow
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-preservation-audit-temp.yml
          git add .github/workflows/house-preservation-audit-temp.yml
          git commit -m "test(house): remove temporary preservation audit" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
