name: House context diagnostic temporary

on:
  push:
    branches: [feat/house-governanca-phase1]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Context unit test
        run: npm test -- src/lib/cardapio/governanca-contexto.test.ts
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
      - name: Build
        if: always()
        run: npm run build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: house-context-proof
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: house-context-proof
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: house-context-proof
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: house-context-proof
          NEXT_PUBLIC_GEMINI_API_KEY: house-context-proof
          NEXT_PUBLIC_GROQ_KEY: house-context-proof
      - name: Remove temporary diagnostic
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-context-diagnostic-temp.yml
          git add .github/workflows/house-context-diagnostic-temp.yml
          git commit -m "test(house): remove temporary context diagnostic"
          git push origin HEAD:feat/house-governanca-phase1
