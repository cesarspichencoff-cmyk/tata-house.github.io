import {
  estoqueOficialParaPlanejamento,
  MAX_IDADE_CONTAGEM_ESTOQUE_DIAS,
  normalizarSnapshotEstoqueGovernanca,
} from './governanca-estoque-oficial';

const base = {
  contrato: 'tata-house-governanca-estoque-readonly',
