name: Verify House Cohesion Materialized Temp

on:
  push:
    branches:
      - verify/house-cohesion-pass-20260909

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-intelligence-v2-cohesion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Anchor exact materialized candidate
        run: |
          test "$(git rev-parse HEAD)" = "3f3708b858a436bcc6d1da1d8e75d07522b3a1ca"
          test "$(git rev-parse HEAD^)" = "dc6bb54a22bf89f671aaaf1a91ce340cb406bf4a"
      - name: Exact production delta
        shell: bash
        run: |
          git diff --check 7f77fc88a12b11d40a185230f50d34172528082e...HEAD
          git diff --name-only 7f77fc88a12b11d40a185230f50d34172528082e...HEAD > /tmp/files
          cat /tmp/files
          test "$(wc -l < /tmp/files | tr -d ' ')" = "14"
          ! grep -E '^\.github/|^tools/' /tmp/files
          grep -qx 'src/components/cardapio/ContadorRefeicoes.tsx' /tmp/files
          grep -qx 'src/lib/cardapio/governanca-estoque-oficial.ts' /tmp/files
          grep -qx 'src/lib/cardapio/governanca-estoque-oficial.test.ts' /tmp/files
          test ! -e src/components/cardapio/ContadorRefeicoes.tsx
          echo 'HOUSE_COHESION_MATERIALIZED_SCOPE=PASS'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Final receipt
        run: |
          echo 'HOUSE_COHESION_MATERIALIZED=PASS'
          echo 'HOUSE_HEAD=3f3708b858a436bcc6d1da1d8e75d07522b3a1ca'
          echo 'PRODUCTION_BASE=7f77fc88a12b11d40a185230f50d34172528082e'
