name: House governance UUID readiness gate
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-governanca-uuid-temp.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply fail-closed UUID hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/cardapio/governanca-outbox.ts')
          s=p.read_text()
          old="""function idEvento(): string {\n  try {\n    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {\n      return crypto.randomUUID();\n    }\n  } catch {\n    // fallback abaixo\n  }\n  return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;\n}\n"""
          new="""function uuidV4Fallback(): string {\n  const bytes = new Uint8Array(16);\n  try {\n    if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {\n      crypto.getRandomValues(bytes);\n    } else {\n      for (let i = 0; i < bytes.length; i += 1) bytes[i] = Math.floor(Math.random() * 256);\n    }\n  } catch {\n    for (let i = 0; i < bytes.length; i += 1) bytes[i] = Math.floor(Math.random() * 256);\n  }\n\n  // RFC 4122 v4. O contrato continua aceitando IDs legados já persistidos,\n  // mas todo evento NOVO nasce em formato UUID para manter identidade estável\n  // entre retries e ser compatível com operation_id do TATÁ OS.\n  bytes[6] = (bytes[6] & 0x0f) | 0x40;\n  bytes[8] = (bytes[8] & 0x3f) | 0x80;\n  const h = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');\n  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;\n}\n\nfunction idEvento(): string {\n  try {\n    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {\n      return crypto.randomUUID();\n    }\n  } catch {\n    // fallback UUID abaixo\n  }\n  return uuidV4Fallback();\n}\n"""
          if s.count(old)!=1: raise SystemExit('outbox UUID anchor mismatch')
          p.write_text(s.replace(old,new,1))

          t=Path('src/lib/cardapio/governanca-outbox.test.ts')
          x=t.read_text()
          anchor="""    expect(listarPendenciasGovernanca()).toHaveLength(1);\n    expect(fetchMock).not.toHaveBeenCalled();\n  });\n\n  it('confirma somente IDs explicitamente aceitos', () => {"""
          insert="""    expect(evento?.id).toMatch(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);\n    expect(listarPendenciasGovernanca()).toHaveLength(1);\n    expect(fetchMock).not.toHaveBeenCalled();\n  });\n\n  it('mantém UUID v4 mesmo sem crypto.randomUUID', () => {\n    vi.stubGlobal('crypto', {\n      getRandomValues(bytes: Uint8Array) {\n        for (let i = 0; i < bytes.length; i += 1) bytes[i] = i + 1;\n        return bytes;\n      },\n    });\n\n    const evento = registrarAvaliacaoGovernancaPendente({\n      data: new Date(2026, 8, 5),\n      prato: 'Prato fallback',\n      voto: 'ok',\n    });\n\n    expect(evento?.id).toMatch(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);\n  });\n\n  it('confirma somente IDs explicitamente aceitos', () => {"""
          if x.count(anchor)!=1: raise SystemExit('test anchor mismatch')
          t.write_text(x.replace(anchor,insert,1))
          PY
      - name: Targeted tests
        run: npx vitest run src/lib/cardapio/governanca-outbox.test.ts src/lib/cardapio/governanca-sync.test.ts
      - name: Typecheck and diff
        run: |
          npm run typecheck
          git diff --check
      - name: Commit functional hardening
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add src/lib/cardapio/governanca-outbox.ts src/lib/cardapio/governanca-outbox.test.ts
          git commit -m "fix(house): use stable UUIDs for governance outbox events"
          git push origin HEAD:feat/house-governanca-phase1
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin feat/house-governanca-phase1
          git reset --hard origin/feat/house-governanca-phase1
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-governanca-uuid-temp.yml
          git add .github/workflows/house-governanca-uuid-temp.yml
          git commit -m "test(house): remove temporary UUID readiness gate" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
