name: Verify compras sync hotfix

on:
  push:
    branches: [fix/compras-quantidade-sync-20260923]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded patch
        run: python scripts/aplicar-fix-compras-sync.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit proven patch and remove temporary automation
        run: |
          git rm scripts/aplicar-fix-compras-sync.py .github/workflows/verify-compras-sync-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cardapio/ListaCompras.tsx src/lib/cardapio/merge-semana.ts src/components/cardapio/CampoQuantidadeCompra.tsx src/lib/cardapio/quantidade-compra.ts src/lib/cardapio/quantidade-compra.test.ts src/lib/cardapio/merge-semana-ajustes.test.ts
          git commit -m "fix(compras): impedir zero transitório e preservar exclusões [skip ci]"
          git push origin HEAD:fix/compras-quantidade-sync-20260923
