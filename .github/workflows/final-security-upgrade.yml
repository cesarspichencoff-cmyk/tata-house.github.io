name: Final Clean Proof

on:
  push:
    branches:
      - feat/tata-house-final-reconciled-20260917
    paths:
      - .github/workflows/final-security-upgrade.yml

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install persisted lockfile exactly
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit all dependencies
        run: npm audit
