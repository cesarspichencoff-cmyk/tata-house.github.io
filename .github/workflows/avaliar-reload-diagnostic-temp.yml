name: House avaliar reload diagnostic temporary

on:
  push:
    branches: [feat/house-governanca-phase1]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build House
        run: npm ci && npm run build
      - name: Install browser
        run: |
          mkdir -p /tmp/house-reload && cd /tmp/house-reload
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Prepare diagnostic server and browser
        run: |
          cat > /tmp/house-reload.cjs <<'NODE'
          const http=require('http'),fs=require('fs'),path=require('path');
          const mode=process.argv[2],root=path.join(process.env.GITHUB_WORKSPACE,'out');
          function mime(f){if(f.endsWith('.html'))return'text/html; charset=utf-8';if(f.endsWith('.js')||f.endsWith('.mjs'))return'application/javascript; charset=utf-8';if(f.endsWith('.css'))return'text/css; charset=utf-8';if(f.endsWith('.json'))return'application/json';return'application/octet-stream'}
          function server(){http.createServer((req,res)=>{let rel=decodeURIComponent(new URL(req.url,'http://localhost').pathname);while(rel.startsWith('/'))rel=rel.slice(1);if(!rel)rel='index.html';if(rel.endsWith('/'))rel+='index.html';const br=path.resolve(root),f=path.resolve(root,rel);if(!f.startsWith(br+path.sep)&&f!==br){res.writeHead(403);return res.end('forbidden')}try{if(!fs.statSync(f).isFile())throw new Error();res.writeHead(200,{'content-type':mime(f),'cache-control':'no-store'});fs.createReadStream(f).pipe(res)}catch{res.writeHead(404);res.end('not found')}}).listen(3000,'127.0.0.1',()=>console.log('SERVER_READY'))}
          async function diag(){const {chromium}=require('/tmp/house-reload/node_modules/playwright');const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:390,height:844},timezoneId:'America/Sao_Paulo'});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>console.log('PAGE_CONSOLE',m.type(),m.text()));await page.goto('http://127.0.0.1:3000/avaliar.html',{waitUntil:'domcontentloaded'});const before=await page.evaluate(()=>({now:new Date().toString(),iso:new Date().toISOString(),body:document.body.innerText.slice(0,500),keys:Object.keys(localStorage)}));console.log('RELOAD_BEFORE',JSON.stringify(before));await page.evaluate(()=>{localStorage.clear();localStorage.setItem('tata.governanca.cardapio.v1.tata-house.2026-09-06',JSON.stringify({contrato:'tata-house-governanca',versao:1,tipo:'cardapio.dia',origem:'governanca',atualizadoEm:'2026-09-06T05:54:03.510Z',data:'2026-09-06',unidade:'tata-house',principal:'Frango Persistido DIAG',guarnicao:'Arroz DIAG',salada:'Folhas DIAG'}));localStorage.setItem('tata.governanca.unidade-fonte.v1',JSON.stringify({data:'2026-09-06',unidadeFonte:'Itaim',recebidoEm:'2026-09-06T05:54:03.630Z'}))});const stored=await page.evaluate(()=>({keys:Object.keys(localStorage),menu:localStorage.getItem('tata.governanca.cardapio.v1.tata-house.2026-09-06'),source:localStorage.getItem('tata.governanca.unidade-fonte.v1')}));console.log('RELOAD_STORED',JSON.stringify(stored));await page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(1500);const after=await page.evaluate(()=>({now:new Date().toString(),iso:new Date().toISOString(),body:document.body.innerText.slice(0,800),keys:Object.keys(localStorage),menu:localStorage.getItem('tata.governanca.cardapio.v1.tata-house.2026-09-06'),source:localStorage.getItem('tata.governanca.unidade-fonte.v1'),width:[document.documentElement.scrollWidth,document.documentElement.clientWidth]}));console.log('RELOAD_AFTER',JSON.stringify(after));console.log('RELOAD_ERRORS',JSON.stringify(errors));if(!after.body.includes('Frango Persistido DIAG')){console.error('RELOAD_RENDER=FAIL');process.exitCode=1}else console.log('RELOAD_RENDER=PASS');await browser.close()}
          if(mode==='server')server();else diag().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/house-reload.cjs
      - name: Start server
        run: |
          node /tmp/house-reload.cjs server >/tmp/house-reload-server.log 2>&1 &
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:3000/avaliar.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/house-reload-server.log; exit 1
      - name: Diagnose reload
        run: node /tmp/house-reload.cjs diag
      - name: Remove temporary diagnostic
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git fetch origin feat/house-governanca-phase1
          git reset --hard origin/feat/house-governanca-phase1
          rm -f .github/workflows/avaliar-reload-diagnostic-temp.yml
          git add -A .github/workflows/avaliar-reload-diagnostic-temp.yml
          git diff --cached --quiet && exit 0
          git commit -m "test(house): remove temporary avaliar reload diagnostic"
          git push origin HEAD:feat/house-governanca-phase1
