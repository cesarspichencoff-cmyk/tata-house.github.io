name: Phase 1 Exact-Origin E2E (temporary)

on:
  push:
    branches:
      - feat/house-governanca-phase1

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout House
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build House static export
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: phase1-e2e
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: phase1-e2e
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: phase1-e2e
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: phase1-e2e
          NEXT_PUBLIC_GEMINI_API_KEY: phase1-e2e
          NEXT_PUBLIC_GROQ_KEY: phase1-e2e
      - name: Checkout Lideres bridge after House build
        uses: actions/checkout@v4
        with:
          repository: cesarspichencoff-cmyk/lideres
          ref: feat/tatahouse-governanca-phase1
          path: lideres
      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create exact-origin HTTPS harness
        run: |
          cat > /tmp/phase1-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tata-house-governanca-phase1
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          DNS.2=lideres.tatasushi.tech
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/phase1-key.pem -out /tmp/phase1-cert.pem \
            -config /tmp/phase1-cert.cnf >/dev/null 2>&1

          cat > /tmp/phase1-server.cjs <<'EOF'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          const { URL } = require('url');

          const root = process.env.GITHUB_WORKSPACE;
          const houseRoot = path.join(root, 'out');
          const bridgePath = path.join(root, 'lideres/compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js');
          const harness = `<!doctype html><html><head><meta charset="utf-8"><title>Phase 1 E2E</title></head><body data-result="pending"><button id="start">Executar handoff</button><pre id="status">idle</pre><script src="/compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js"></script><script>
          function hojeLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
          document.getElementById('start').addEventListener('click', async function(){
            const status=document.getElementById('status');
            try {
              const snapshot=window.TataHouseGovernancaLocalBridgeV1.criarSnapshot({data:hojeLocal(),unidade:'tata-house',principal:'Frango E2E Governança',guarnicao:'Legumes E2E',salada:'Folhas E2E'});
              const result=await window.TataHouseGovernancaLocalBridgeV1.abrirEEnviar(snapshot,{timeoutMs:12000,aoStatus:(s)=>status.textContent=s});
              window.__E2E_RESULT=result;
              document.body.dataset.result='ok';
              status.textContent='ACK '+result.correlationId;
            } catch (e) {
              window.__E2E_ERROR=String(e && e.message || e);
              document.body.dataset.result='error';
              status.textContent=window.__E2E_ERROR;
            }
          });
          </script></body></html>`;

          function send(res, code, body, type='text/plain; charset=utf-8') {
            res.writeHead(code, {'content-type': type, 'cache-control':'no-store'});
            res.end(body);
          }
          function mime(file) {
            if (file.endsWith('.html')) return 'text/html; charset=utf-8';
            if (file.endsWith('.js')) return 'application/javascript; charset=utf-8';
            if (file.endsWith('.css')) return 'text/css; charset=utf-8';
            if (file.endsWith('.json')) return 'application/json; charset=utf-8';
            if (file.endsWith('.svg')) return 'image/svg+xml';
            if (file.endsWith('.png')) return 'image/png';
            if (file.endsWith('.jpg') || file.endsWith('.jpeg')) return 'image/jpeg';
            if (file.endsWith('.woff2')) return 'font/woff2';
            return 'application/octet-stream';
          }
          function serveFile(res, base, pathname) {
            let rel = decodeURIComponent(pathname).replace(/^\/+/, '');
            if (!rel) rel = 'index.html';
            if (rel.endsWith('/')) rel += 'index.html';
            const file = path.resolve(base, rel);
            if (!file.startsWith(path.resolve(base) + path.sep) && file !== path.resolve(base)) return send(res, 403, 'forbidden');
            try {
              const stat = fs.statSync(file);
              if (!stat.isFile()) return send(res, 404, 'not found');
              res.writeHead(200, {'content-type': mime(file), 'cache-control':'no-store'});
              fs.createReadStream(file).pipe(res);
            } catch { send(res, 404, 'not found'); }
          }

          https.createServer({key:fs.readFileSync('/tmp/phase1-key.pem'),cert:fs.readFileSync('/tmp/phase1-cert.pem')}, (req,res) => {
            const host=(req.headers.host||'').split(':')[0];
            const pathname=new URL(req.url, 'https://'+host).pathname;
            if (host === 'lideres.tatasushi.tech') {
              if (pathname === '/harness.html') return send(res, 200, harness, 'text/html; charset=utf-8');
              if (pathname === '/compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js') {
                return send(res, 200, fs.readFileSync(bridgePath), 'application/javascript; charset=utf-8');
              }
              return send(res, 404, 'not found');
            }
            if (host === 'tata-house.github.io') return serveFile(res, houseRoot, pathname);
            return send(res, 421, 'unknown host');
          }).listen(443, '0.0.0.0', () => console.log('phase1 https harness ready'));
          EOF

          sudo -E node /tmp/phase1-server.cjs >/tmp/phase1-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve tata-house.github.io:443:127.0.0.1 -ksSf https://tata-house.github.io/avaliar.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase1-server.log
          exit 1
      - name: Run exact-origin browser proof
        run: |
          cat > /tmp/phase1-e2e.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:[
              '--host-resolver-rules=MAP tata-house.github.io 127.0.0.1, MAP lideres.tatasushi.tech 127.0.0.1',
              '--no-proxy-server'
            ]});
            const context = await browser.newContext({ignoreHTTPSErrors:true});
            const lideres = await context.newPage();
            await lideres.goto('https://lideres.tatasushi.tech/harness.html', {waitUntil:'domcontentloaded'});
            const popupPromise = context.waitForEvent('page');
            await lideres.click('#start');
            const house = await popupPromise;
            await house.waitForLoadState('domcontentloaded');
            await lideres.waitForFunction(() => document.body.dataset.result === 'ok' || document.body.dataset.result === 'error', null, {timeout:15000});
            const state = await lideres.getAttribute('body','data-result');
            if (state !== 'ok') throw new Error('Governança não recebeu ACK: ' + await lideres.locator('#status').innerText());
            await house.waitForFunction(() => document.body.innerText.includes('Frango E2E Governança'), null, {timeout:15000});
            const stored = await house.evaluate(() => Object.entries(localStorage).filter(([k]) => k.startsWith('tata.governanca.cardapio.v1.')));
            if (stored.length !== 1) throw new Error('Snapshot local esperado não encontrado: ' + JSON.stringify(stored));
            const payload = JSON.parse(stored[0][1]);
            if (payload.principal !== 'Frango E2E Governança' || payload.origem !== 'governanca' || payload.versao !== 1) throw new Error('Snapshot persistido divergente: '+JSON.stringify(payload));
            const result = await lideres.evaluate(() => window.__E2E_RESULT);
            console.log('E2E_ACK', JSON.stringify(result));
            console.log('E2E_SNAPSHOT', JSON.stringify(payload));
            console.log('E2E_UI', await house.locator('body').innerText());
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
          node /tmp/phase1-e2e.cjs
