name: House Intelligence Final Temp

on:
  push:
    branches:
      - feat/house-plus-intelligence-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-materialized-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Diff check
        run: git diff --check 7f77fc88a12b11d40a185230f50d34172528082e...HEAD
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Preserve House generator and print system
        run: |
          git diff --quiet 7f77fc88a12b11d40a185230f50d34172528082e -- \
            src/lib/cardapio/motor.ts \
            src/components/cardapio/PlaquinhaQR.tsx \
            src/components/cardapio/PosterSemana.tsx \
            src/components/QrCode.tsx \
            src/components/cardapio/AbaAceitacao.tsx
          grep -Fq "QRCode.toDataURL" src/components/cardapio/PlaquinhaQR.tsx
          grep -Fq "window.print()" src/components/cardapio/PlaquinhaQR.tsx
          grep -Fq "QRCode.toDataURL" src/components/cardapio/PosterSemana.tsx
          grep -Fq "window.print()" src/components/cardapio/PosterSemana.tsx
          grep -Fq "<PlaquinhaQR" src/components/cardapio/AbaAceitacao.tsx
          grep -Fq "sugerirSemanaHistorica" src/lib/cardapio/governanca-candidatos.ts
          grep -Fq "sugerirSemanaCriativa" src/lib/cardapio/governanca-candidatos.ts
          grep -Fq "sugerirSemana(" src/lib/cardapio/governanca-candidatos.ts
          grep -Fq "Desperdício" src/components/cardapio/CenariosGovernanca.tsx
          echo "HOUSE_MATERIALIZED_CANDIDATE=PASS"
          echo "HOUSE_AUTO_GENERATOR_PRESERVED=PASS"
          echo "HOUSE_QR_PRINT_PRESERVED=PASS"
          echo "HOUSE_WASTE_VISIBLE=PASS"
