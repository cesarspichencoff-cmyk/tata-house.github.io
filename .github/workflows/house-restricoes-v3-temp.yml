name: House Restricoes V3 Temp

on:
  push:
    branches:
      - feat/house-plus-intelligence-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply deterministic patch
        run: |
          node .github/scripts/fix-governanca-restricoes-type-v1.mjs
          node .github/scripts/apply-house-restricoes-v3.mjs
      - name: Diff check
        run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "NO_PATCH_DIFF=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cardapio/governanca-restricoes.ts src/lib/cardapio/governanca-candidatos.ts src/components/cardapio/PlanejadorGovernanca.tsx
          git commit -m "feat(house): usar restricoes na inteligencia e validar com Plus"
          git push
