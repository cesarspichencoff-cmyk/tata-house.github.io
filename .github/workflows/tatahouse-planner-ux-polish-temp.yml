name: TATA House planner UX polish temporary

on:
  push:
    branches: [feat/house-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-planner-ux-polish-temp.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded UX polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/cardapio/PlanejadorGovernanca.tsx')
          s=p.read_text()
          def rep(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'expected once, found {s.count(old)}: {old[:80]}')
              s=s.replace(old,new)
          rep("  alertas: string[];\n}) {\n  return (", "  alertas: string[];\n}) {\n  const temBloqueioPrincipal = bloqueios.some((item) => /prato principal.*não definido/i.test(item));\n  const alertasUteis = alertas.filter((item) => !(temBloqueioPrincipal && /sem prato principal definido/i.test(item)));\n  const bloqueiosVisiveis = bloqueios.slice(0, 6);\n  const bloqueiosRestantes = Math.max(0, bloqueios.length - bloqueiosVisiveis.length);\n  const alertasVisiveis = alertasUteis.slice(0, 6);\n  const alertasRestantes = Math.max(0, alertasUteis.length - alertasVisiveis.length);\n  return (")
          rep('Planejamento governado','Planejamento da semana')
          rep('O House recomenda e compara. A Governança recebe o rascunho. O humano aprova.','O House compara opções. Você revisa a semana e decide antes de enviar.')
          rep('(bloqueios.length > 0 || alertas.length > 0)','(bloqueios.length > 0 || alertasUteis.length > 0)')
          rep("              <ul className=\"mt-2 space-y-1.5 text-sm text-red-800 dark:text-red-200\">\n                {bloqueios.slice(0, 6).map((item) => <li key={item}>• {item}</li>)}\n              </ul>", "              <ul className=\"mt-2 space-y-1.5 text-sm text-red-800 dark:text-red-200\">\n                {bloqueiosVisiveis.map((item) => <li key={item}>• {item}</li>)}\n              </ul>\n              {bloqueiosRestantes > 0 && (\n                <p className=\"mt-2 text-xs font-bold text-red-700 dark:text-red-300\">+{bloqueiosRestantes} bloqueio{bloqueiosRestantes === 1 ? '' : 's'} adicional{bloqueiosRestantes === 1 ? '' : 'is'}</p>\n              )}")
          rep('{alertas.length > 0 && (','{alertasUteis.length > 0 && (')
          rep("              <ul className=\"mt-2 space-y-1.5 text-sm text-carvao-700 dark:text-carvao-200\">\n                {alertas.slice(0, 6).map((item) => <li key={item}>• {item}</li>)}\n              </ul>", "              <ul className=\"mt-2 space-y-1.5 text-sm text-carvao-700 dark:text-carvao-200\">\n                {alertasVisiveis.map((item) => <li key={item}>• {item}</li>)}\n              </ul>\n              {alertasRestantes > 0 && (\n                <p className=\"mt-2 text-xs font-bold text-ouro-700 dark:text-ouro-300\">+{alertasRestantes} ponto{alertasRestantes === 1 ? '' : 's'} adicional{alertasRestantes === 1 ? '' : 'is'}</p>\n              )}")
          rep('<strong>Histórico oficial em leitura:</strong> {evidenciaReadOnly.dias.length} dia(s) · {evidenciaReadOnly.principais.length} principal(is) agregados · {evidenciaReadOnly.periodo.de.split(\'-\').reverse().join(\'/\')} a {evidenciaReadOnly.periodo.ate.split(\'-\').reverse().join(\'/\')}. Nenhum dado foi gravado no Supabase.','<strong>Histórico oficial carregado:</strong> {evidenciaReadOnly.dias.length} dia(s) · {evidenciaReadOnly.principais.length} principal(is) agregados · {evidenciaReadOnly.periodo.de.split(\'-\').reverse().join(\'/\')} a {evidenciaReadOnly.periodo.ate.split(\'-\').reverse().join(\'/\')}. Usado somente para analisar esta semana.')
          p.write_text(s)

          p=Path('src/components/cardapio/CenariosGovernanca.tsx')
          s=p.read_text()
          def rep2(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'expected once, found {s.count(old)}: {old[:80]}')
              s=s.replace(old,new)
          rep2('Decisão antes da edição','Compare antes de montar')
          rep2('O House usa o motor real e mede cada proposta com as mesmas fontes de custo, regras, aceitação e histórico. Nenhum cenário vira cardápio sozinho.','Compare propostas com custo, regras, aceitação e histórico. Nenhum cenário vira cardápio sozinho.')
          rep2('Cenário aplicado somente ao rascunho local. Revise e ajuste os dias antes de enviar para a Governança.','Cenário aplicado à proposta. Revise os dias antes de continuar.')
          rep2('Aplicar = trocar apenas o <strong>rascunho local</strong>. Publicação oficial, Supabase e aprovação automática continuam bloqueados.','Aplicar altera apenas esta <strong>proposta</strong>. Nada é publicado sem sua revisão e aprovação.')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'src/components/cardapio/PlanejadorGovernanca.tsx'
          git diff --name-only | grep -Fx 'src/components/cardapio/CenariosGovernanca.tsx'
      - name: Regression
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit bounded product files
        run: |
          git config user.name 'VÉRTICE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/cardapio/PlanejadorGovernanca.tsx src/components/cardapio/CenariosGovernanca.tsx
          git commit -m 'ux(house): simplify planner decision surface'
          git pull --rebase origin feat/house-governanca-phase1
          git push origin HEAD:feat/house-governanca-phase1
