name: House readonly consume v3 temporary
on:
  push:
    branches:
      - feat/house-governanca-phase1
    paths:
      - '.github/workflows/house-readonly-consume-v3-temp.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - name: Patch planner component
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/cardapio/PlanejadorGovernanca.tsx')
          s=p.read_text()
          old="} from '@/lib/cardapio/governanca-planejador';\n"
          new=old+"import {\n  frequenciaOficial4Semanas,\n  instalarHandoffEvidenciaReadOnly,\n  type EvidenciaGovernancaReadOnlyV1,\n} from '@/lib/cardapio/governanca-readonly';\n"
          assert old in s and 'governanca-readonly' not in s
          s=s.replace(old,new,1)
          old2="  const [mensagemEnvio, setMensagemEnvio] = useState('');\n  const proposalIdPendente = useRef<string | null>(null);"
          new2="  const [mensagemEnvio, setMensagemEnvio] = useState('');\n  const [evidenciaReadOnly, setEvidenciaReadOnly] = useState<EvidenciaGovernancaReadOnlyV1 | null>(null);\n  const proposalIdPendente = useRef<string | null>(null);"
          assert old2 in s
          s=s.replace(old2,new2,1)
          old3="    ids.forEach((sid) => {\n      lerSemana(sid).dias.forEach((dia) => {\n        if (!dia.principal) return;\n        const chave = normalizar(dia.principal);\n        cont[chave] = (cont[chave] ?? 0) + 1;\n      });\n    });\n    return cont;\n  }, [contexto.semanaId]);"
          new3="    ids.forEach((sid) => {\n      lerSemana(sid).dias.forEach((dia) => {\n        if (!dia.principal) return;\n        const chave = normalizar(dia.principal);\n        cont[chave] = (cont[chave] ?? 0) + 1;\n      });\n    });\n    const oficial = frequenciaOficial4Semanas(evidenciaReadOnly);\n    Object.entries(oficial).forEach(([chave, qtd]) => {\n      cont[chave] = Math.max(cont[chave] ?? 0, qtd);\n    });\n    return cont;\n  }, [contexto.semanaId, evidenciaReadOnly]);"
          assert old3 in s
          s=s.replace(old3,new3,1)
          old4="  useEffect(() => instalarHandoffPlanejadorGovernanca({\n"
          new4="  useEffect(() => instalarHandoffEvidenciaReadOnly({\n    unidadeEsperada: contexto.unidadeFonte,\n    semanaEsperada: contexto.semanaId,\n    aoEvidencia: setEvidenciaReadOnly,\n  }), [contexto.semanaId, contexto.unidadeFonte]);\n\n  useEffect(() => instalarHandoffPlanejadorGovernanca({\n"
          assert old4 in s
          s=s.replace(old4,new4,1)
          old5="        <FaixaStatus\n          contexto={contexto}\n          podeEnviar={prontidao.podeEnviar}\n          bloqueios={prontidao.bloqueios}\n          alertas={prontidao.alertas}\n        />\n\n        <div className=\"sticky top-2"
          new5="        <FaixaStatus\n          contexto={contexto}\n          podeEnviar={prontidao.podeEnviar}\n          bloqueios={prontidao.bloqueios}\n          alertas={prontidao.alertas}\n        />\n\n        {evidenciaReadOnly && (\n          <section data-testid=\"evidencia-readonly-lideres\" className=\"rounded-2xl border border-brand-100 bg-brand-50/70 px-4 py-3 text-sm text-brand-900 dark:border-brand-900 dark:bg-brand-950/20 dark:text-brand-100\">\n            <strong>Histórico oficial em leitura:</strong> {evidenciaReadOnly.dias.length} dia(s) · {evidenciaReadOnly.principais.length} principal(is) agregados · {evidenciaReadOnly.periodo.de.split('-').reverse().join('/')} a {evidenciaReadOnly.periodo.ate.split('-').reverse().join('/')}. Nenhum dado foi gravado no Supabase.\n          </section>\n        )}\n\n        <div className=\"sticky top-2"
          assert old5 in s
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
      - name: Install
        run: npm ci
      - name: Targeted tests
        run: npx vitest run src/lib/cardapio/governanca-readonly.test.ts src/lib/cardapio/governanca-planejador.test.ts src/lib/cardapio/governanca-candidatos.test.ts src/lib/cardapio/governanca-trocas.test.ts
      - name: Full tests
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Structural gate
        run: |
          grep -q 'evidencia-readonly-lideres' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'Math.max(cont\[chave\] ?? 0, qtd)' src/components/cardapio/PlanejadorGovernanca.tsx
          ! grep -E '(localStorage|sessionStorage|indexedDB)' src/lib/cardapio/governanca-readonly.ts
          git diff --check
      - name: Commit, rebase and push
        run: |
          git config user.name 'cesarspichencoff-cmyk'
          git config user.email 'cesar.spichencoff@gmail.com'
          git add src/components/cardapio/PlanejadorGovernanca.tsx
          git commit -m 'feat(house): consume readonly official frequency evidence'
          git fetch origin feat/house-governanca-phase1
          git rebase origin/feat/house-governanca-phase1
          npx vitest run src/lib/cardapio/governanca-readonly.test.ts src/lib/cardapio/governanca-planejador.test.ts
          npm run typecheck
          git push origin HEAD:feat/house-governanca-phase1
      - name: Remove temporary workflow
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          git fetch origin feat/house-governanca-phase1
          git reset --hard origin/feat/house-governanca-phase1
          if [ -f .github/workflows/house-readonly-consume-v3-temp.yml ]; then
            git config user.name 'cesarspichencoff-cmyk'
            git config user.email 'cesar.spichencoff@gmail.com'
            git rm .github/workflows/house-readonly-consume-v3-temp.yml
            git commit -m 'test(house): remove readonly consume v3 harness'
            git push origin HEAD:feat/house-governanca-phase1
          fi
