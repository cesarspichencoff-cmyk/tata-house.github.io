name: TATA House meal tables UI temporary

on:
  push:
    branches: [feat/house-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-governanca-ui-patch-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded meal-table UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/cardapio/AbaContagem.tsx')
          s=p.read_text()
          def rep(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'expected once, found {s.count(old)}')
              s=s.replace(old,new)

          old="import type { ContagemRefeicoesDia, EstadoSemana, Papel } from '@/lib/cardapio/tipos';\n"
          rep(old, old + "import { DistribuicaoMesasRefeicao } from '@/components/cardapio/DistribuicaoMesasRefeicao';\n")

          anchor="""            </Botao>
          </div>
        )}

        {totalSemana > 0 && (
"""
          addition="""            </Botao>
            {regAtivo && (
              <DistribuicaoMesasRefeicao
                data={DATAS_SEMANA[diaAtivo]}
                total={{
                  almoco: regAtivo.almoco,
                  jantar: regAtivo.jantar,
                  marmitas: regAtivo.marmitas,
                }}
              />
            )}
          </div>
        )}

        {totalSemana > 0 && (
"""
          rep(anchor, addition)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -Fx 'src/components/cardapio/AbaContagem.tsx'
      - name: Regression
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit bounded product file
        run: |
          git config user.name 'VÉRTICE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/cardapio/AbaContagem.tsx
          git commit -m 'feat(house): expose optional Itaim Pinheiros meal table split'
          git pull --rebase origin feat/house-governanca-phase1
          git push origin HEAD:feat/house-governanca-phase1
