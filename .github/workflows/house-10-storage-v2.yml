name: House 10 Storage V2

on:
  push:
    branches:
      - feat/tata-house-10-10-storage-v2-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply storage v2 patch
        run: python scripts/house10_storage_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified storage patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cardapio/anexos-semana.ts src/lib/cardapio/anexos-semana.test.ts src/lib/cardapio/estado.tsx src/components/BootNuvem.tsx
          if git diff --cached --quiet; then
            echo "No storage delta to persist"
            exit 0
          fi
          git commit -m "[house-patch] fix(storage): tira anexos pesados do localStorage sem perder nuvem"
          git push origin HEAD:feat/tata-house-10-10-storage-v2-20260917
