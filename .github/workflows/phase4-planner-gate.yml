name: Phase 4 Planner Gate

on:
  push:
    branches: [feat/house-governanca-phase1]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        run: |
          set +e
          npm test > phase4-test.log 2>&1
          code=$?
          cat phase4-test.log
          exit $code
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-test-diagnostics
          path: phase4-test.log
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Assert planner export
        run: test -f out/planejar.html && grep -q "Planejador inteligente" out/planejar.html
