name: House PDF.js security proof v4 temporary

on:
  push:
    branches:
      - feat/house-governanca-phase1
    paths:
      - .github/workflows/pdfjs-security-proof-v4-temp.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply isolated official PDF.js remediation in worktree
        run: |
          npm install --save-exact pdfjs-dist@6.2.108
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdf.worker.min.mjs

      - name: Verify package lock worker and real callsite
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const installed = require('./node_modules/pdfjs-dist/package.json');
          if (pkg.dependencies['pdfjs-dist'] !== '6.2.108') throw new Error('package.json != 6.2.108');
          if (lock.packages[''].dependencies['pdfjs-dist'] !== '6.2.108') throw new Error('lock root != 6.2.108');
          if (lock.packages['node_modules/pdfjs-dist']?.version !== '6.2.108') throw new Error('lock resolved != 6.2.108');
          if (installed.version !== '6.2.108') throw new Error('installed != 6.2.108');
          const src = fs.readFileSync('src/components/cardapio/AbaCotacao.tsx', 'utf8');
          if (!src.includes("const pdfjsLib = await import('pdfjs-dist')")) throw new Error('real import missing');
          if (!src.includes("GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs'")) throw new Error('local worker missing');
          if (!src.includes('getDocument({ data: new Uint8Array(arrayBuffer) })')) throw new Error('real getDocument path changed');
          if (!src.includes('getTextContent()')) throw new Error('real text extraction missing');
          console.log('PDFJS_PACKAGE_VERSION=PASS');
          console.log('PDFJS_REAL_CALLSITE=PASS');
          NODE
          cmp -s public/pdf.worker.min.mjs node_modules/pdfjs-dist/build/pdf.worker.min.mjs
          echo PDFJS_WORKER_MATCH=PASS

      - name: Verify pdfjs-dist absent from npm audit vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          if (audit.vulnerabilities?.['pdfjs-dist']) {
            throw new Error('pdfjs-dist still vulnerable: ' + JSON.stringify(audit.vulnerabilities['pdfjs-dist']));
          }
          console.log('PDFJS_NPM_AUDIT=PASS');
          console.log('NPM_AUDIT_TOTALS=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium proof dependency
        run: |
          mkdir -p /tmp/pdfjs-proof-v4
          cd /tmp/pdfjs-proof-v4
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Prepare exact-origin browser proof with diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          objects = [
              '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
              '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n',
              '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>\nendobj\n',
              '4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n',
          ]
          stream = 'BT\n/F1 18 Tf\n72 720 Td\n(PDF SEGURANCA OK) Tj\nET\n'
          objects.append(f'5 0 obj\n<< /Length {len(stream.encode())} >>\nstream\n{stream}endstream\nendobj\n')
          out = bytearray(b'%PDF-1.4\n')
          offsets = []
          for obj in objects:
              offsets.append(len(out))
              out.extend(obj.encode())
          xref = len(out)
          out.extend(f'xref\n0 {len(objects)+1}\n'.encode())
          out.extend(b'0000000000 65535 f \n')
          for off in offsets:
              out.extend(f'{off:010d} 00000 n \n'.encode())
          out.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('/tmp/pdfjs-proof-v4/sample.pdf').write_bytes(out)
          PY

          cat > /tmp/pdfjs-proof-v4-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tata-house.github.io
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/pdfjs-proof-v4-key.pem \
            -out /tmp/pdfjs-proof-v4-cert.pem \
            -config /tmp/pdfjs-proof-v4-cert.cnf >/dev/null 2>&1

          cat > /tmp/pdfjs-proof-v4/server.cjs <<'NODE'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;
          const html = `<!doctype html><html><head><meta charset="utf-8"><title>PDF.js proof v4</title></head><body>
          <input id="file" type="file"><pre id="result">WAIT</pre><pre id="boot">BOOTING</pre>
          <script>
          window.__PDFJS_BOOT_DONE = false;
          window.__PDFJS_BOOT_ERROR = null;
          window.__PDF_PROOF_DONE = false;
          window.__PDF_PROOF = null;
          (async () => {
            try {
              const pdfjsLib = await import('/pdfjs/pdf.mjs');
              window.__PDFJS_VERSION = pdfjsLib.version;
              pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs';
              document.getElementById('boot').textContent = 'READY ' + pdfjsLib.version;
              document.getElementById('file').addEventListener('change', async (e) => {
                try {
                  const file = e.target.files[0];
                  const arrayBuffer = await file.arrayBuffer();
                  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
                  const paginas = [];
                  for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    paginas.push(content.items.map((it) => ('str' in it ? it.str : '')).join(' '));
                  }
                  const text = paginas.join('\n');
                  document.getElementById('result').textContent = text;
                  window.__PDF_PROOF = { ok: true, version: pdfjsLib.version, numPages: pdf.numPages, text };
                } catch (err) {
                  window.__PDF_PROOF = { ok: false, error: String(err), stack: err && err.stack ? String(err.stack) : '' };
                  document.getElementById('result').textContent = 'ERROR ' + String(err);
                } finally {
                  window.__PDF_PROOF_DONE = true;
                }
              });
            } catch (err) {
              window.__PDFJS_BOOT_ERROR = { error: String(err), stack: err && err.stack ? String(err.stack) : '' };
              document.getElementById('boot').textContent = 'BOOT ERROR ' + String(err);
            } finally {
              window.__PDFJS_BOOT_DONE = true;
            }
          })();
          </script></body></html>`;

          function send(res, status, body, type = 'text/plain; charset=utf-8') {
            res.writeHead(status, { 'content-type': type, 'cache-control': 'no-store' });
            res.end(body);
          }
          function stream(res, file, type) {
            if (!fs.existsSync(file)) return send(res, 404, 'not found ' + file);
            res.writeHead(200, { 'content-type': type, 'cache-control': 'no-store' });
            fs.createReadStream(file).pipe(res);
          }
          https.createServer({
            key: fs.readFileSync('/tmp/pdfjs-proof-v4-key.pem'),
            cert: fs.readFileSync('/tmp/pdfjs-proof-v4-cert.pem')
          }, (req, res) => {
            const pathname = new URL(req.url, 'https://tata-house.github.io').pathname;
            console.log('REQ', pathname);
            if (pathname === '/' || pathname === '/pdf-proof.html') return send(res, 200, html, 'text/html; charset=utf-8');
            if (pathname === '/pdf.worker.min.mjs') return stream(res, path.join(root, 'public/pdf.worker.min.mjs'), 'application/javascript');
            if (pathname.startsWith('/pdfjs/')) {
              const rel = pathname.slice('/pdfjs/'.length);
              const file = path.join(root, 'node_modules/pdfjs-dist/build', rel);
              return stream(res, file, rel.endsWith('.mjs') ? 'application/javascript' : 'application/octet-stream');
            }
            return send(res, 404, 'not found');
          }).listen(443, '0.0.0.0', () => console.log('READY'));
          NODE

          cat > /tmp/pdfjs-proof-v4/test.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: [
              '--host-resolver-rules=MAP tata-house.github.io 127.0.0.1',
              '--no-proxy-server'
            ]});
            const context = await browser.newContext({ ignoreHTTPSErrors: true, viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const consoleLines = [];
            const pageErrors = [];
            const failed = [];
            const responses = [];
            page.on('console', msg => consoleLines.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => failed.push({ url: req.url(), failure: req.failure()?.errorText || '' }));
            page.on('response', res => {
              if (res.url().includes('tata-house.github.io')) responses.push({ url: res.url(), status: res.status(), type: res.headers()['content-type'] || '' });
            });
            await page.goto('https://tata-house.github.io/pdf-proof.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.__PDFJS_BOOT_DONE === true, null, { timeout: 15000 });
            const boot = await page.evaluate(() => ({ version: window.__PDFJS_VERSION || null, error: window.__PDFJS_BOOT_ERROR || null, text: document.getElementById('boot')?.textContent || '' }));
            console.log('BOOT_STATE=' + JSON.stringify(boot));
            console.log('RESPONSES=' + JSON.stringify(responses));
            console.log('FAILED_REQUESTS=' + JSON.stringify(failed));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
            console.log('CONSOLE=' + JSON.stringify(consoleLines));
            if (boot.error) throw new Error('PDF.js boot failed: ' + JSON.stringify(boot));
            if (boot.version !== '6.2.108') throw new Error('browser runtime version mismatch: ' + JSON.stringify(boot));
            await page.locator('#file').setInputFiles('/tmp/pdfjs-proof-v4/sample.pdf');
            await page.waitForFunction(() => window.__PDF_PROOF_DONE === true, null, { timeout: 15000 });
            const proof = await page.evaluate(() => window.__PDF_PROOF);
            console.log('PDF_PROOF=' + JSON.stringify(proof));
            if (!proof?.ok) throw new Error('PDF extraction failed: ' + JSON.stringify(proof));
            if (proof.version !== '6.2.108' || proof.numPages !== 1 || !String(proof.text).includes('PDF SEGURANCA OK')) {
              throw new Error('PDF extraction mismatch: ' + JSON.stringify(proof));
            }
            const workerResponse = responses.find(r => r.url.endsWith('/pdf.worker.min.mjs'));
            if (!workerResponse || workerResponse.status !== 200) throw new Error('worker was not loaded successfully: ' + JSON.stringify(responses));
            if (pageErrors.length || failed.length) throw new Error('browser errors: ' + JSON.stringify({ pageErrors, failed }));
            console.log('PDFJS_BROWSER_VERSION=PASS');
            console.log('PDFJS_BROWSER_WORKER=PASS');
            console.log('PDFJS_BROWSER_TEXT_EXTRACTION=PASS');
            console.log('PDFJS_EXACT_ORIGIN=PASS');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node --check /tmp/pdfjs-proof-v4/server.cjs
          node --check /tmp/pdfjs-proof-v4/test.cjs

      - name: Start exact-origin proof server
        run: |
          sudo -E node /tmp/pdfjs-proof-v4/server.cjs >/tmp/pdfjs-proof-v4-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve tata-house.github.io:443:127.0.0.1 -ksSf https://tata-house.github.io/pdf-proof.html >/dev/null; then
              cat /tmp/pdfjs-proof-v4-server.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pdfjs-proof-v4-server.log
          exit 1

      - name: Prove real PDF API path in Chromium
        run: |
          cd /tmp/pdfjs-proof-v4
          node test.cjs
          echo '--- SERVER LOG ---'
          cat /tmp/pdfjs-proof-v4-server.log

      - name: Diff hygiene
        run: |
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          printf 'PDFJS_DIFF_FILES=%s\n' "${files[*]}"
          expected=(package-lock.json package.json public/pdf.worker.min.mjs)
          if [ "${files[*]}" != "${expected[*]}" ]; then
            echo "Unexpected diff: ${files[*]}" >&2
            exit 1
          fi
          echo PDFJS_DIFF_HYGIENE=PASS

      - name: Commit isolated official remediation
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add package.json package-lock.json public/pdf.worker.min.mjs
          git commit -m "fix(house): upgrade PDF.js runtime to patched 6.2.108"
          git push origin HEAD:feat/house-governanca-phase1
          echo PDFJS_PRODUCT_COMMIT=PASS

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/house-governanca-phase1
            git reset --hard origin/feat/house-governanca-phase1
            if [ ! -f .github/workflows/pdfjs-security-proof-v4-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/pdfjs-security-proof-v4-temp.yml
            git commit -m "test(house): remove temporary PDF.js proof v4 harness"
            if git push origin HEAD:feat/house-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
