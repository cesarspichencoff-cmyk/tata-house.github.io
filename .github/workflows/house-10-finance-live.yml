name: House 10 Finance Live

on:
  push:
    branches:
      - feat/tata-house-10-10-finance-live-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply finance truth patch
        run: python scripts/house10_finance_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified finance patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cardapio/inteligencia-viva.ts src/lib/cardapio/inteligencia-viva.test.ts src/components/cardapio/PainelInteligenciaViva.tsx
          if git diff --cached --quiet; then
            echo "No finance delta to persist"
            exit 0
          fi
          git commit -m "[house-patch] fix(relatorios): cruza demanda e dinheiro sem falsa precisão"
          git push origin HEAD:feat/tata-house-10-10-finance-live-20260917
