name: House dependency audit temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-dependency-audit-temp.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          path: feature
          fetch-depth: 0
      - name: Checkout canonical House
        uses: actions/checkout@v4
        with:
          repository: tata-house/tata-house.github.io
          ref: 6dc04827b195aaca9d4653618e5a40ca64a1a6f4
          path: canonical
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit feature and canonical lockfiles
        run: |
          cd feature
          npm audit --json > ../feature-audit.json || true
          cd ../canonical
          npm audit --json > ../canonical-audit.json || true
          cd ..
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('feature-audit.json','utf8'));
          const c=JSON.parse(fs.readFileSync('canonical-audit.json','utf8'));
          const summary=x=>({metadata:x.metadata, vulnerabilities:x.vulnerabilities});
          fs.writeFileSync('audit-summary.json', JSON.stringify({feature:summary(f),canonical:summary(c),sameLock:fs.readFileSync('feature/package-lock.json','utf8')===fs.readFileSync('canonical/package-lock.json','utf8')},null,2));
          console.log(JSON.stringify({feature:f.metadata,canonical:c.metadata,sameLock:fs.readFileSync('feature/package-lock.json','utf8')===fs.readFileSync('canonical/package-lock.json','utf8')},null,2));
          NODE
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: house-dependency-audit
          path: |
            feature-audit.json
            canonical-audit.json
            audit-summary.json
          retention-days: 7
      - name: Remove temporary audit workflow
        if: always()
        working-directory: feature
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-dependency-audit-temp.yml
          git add .github/workflows/house-dependency-audit-temp.yml
          git commit -m "audit(house): remove temporary dependency audit" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
