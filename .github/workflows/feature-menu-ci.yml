name: Feature Menu CI

on:
  push:
    branches:
      - feat/menu-intelligence-engine-20260916
  pull_request:
    branches:
      - fix/storage-durability-signal-20260916
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
