name: House runtime advisory final classification temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-runtime-advisory-final-temp.yml]
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - name: Classify deployed and tooling surfaces
        shell: bash
        run: |
          set -euo pipefail
          find . -path './node_modules' -prune -o \( -name 'middleware.ts' -o -name 'middleware.js' -o -name 'middleware.mjs' -o -name 'middleware.cjs' \) -print > /tmp/middleware.txt
          grep -RInE 'pdfjs-dist|pdf\.worker|getDocument\(|GlobalWorkerOptions' src public scripts --exclude='pdf.worker.min.mjs' 2>/dev/null > /tmp/pdfjs-refs.txt || true
          grep -RInE 'next/server|NextResponse|NextRequest|cookies\(|headers\(|server action|use server|rewrites\(|redirects\(' src next.config.mjs 2>/dev/null > /tmp/next-server-refs.txt || true
          grep -RInE 'vitest.*ui|--ui|vitest/ui|@vitest/ui|vitest --ui' package.json src 2>/dev/null > /tmp/vitest-ui-refs.txt || true
          grep -RInE 'accept=.*pdf|application/pdf|\.pdf' src 2>/dev/null > /tmp/pdf-input-refs.txt || true
          node - <<'NODE'
          const fs=require('fs');
          const lines=p=>fs.readFileSync(p,'utf8').trim().split('\n').filter(Boolean);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const cfg=fs.readFileSync('next.config.mjs','utf8');
          const result={
            staticExport:/output\s*:\s*["']export["']/.test(cfg),
            middlewareFiles:lines('/tmp/middleware.txt'),
            nextServerRefs:lines('/tmp/next-server-refs.txt'),
            vitestUiRefs:lines('/tmp/vitest-ui-refs.txt'),
            pdfjsSourceRefs:lines('/tmp/pdfjs-refs.txt'),
            pdfInputRefs:lines('/tmp/pdf-input-refs.txt'),
            scripts:pkg.scripts,
            nextVersion:pkg.dependencies?.next||null,
            pdfjsVersion:pkg.dependencies?.['pdfjs-dist']||null,
            vitestVersion:pkg.devDependencies?.vitest||null
          };
          result.classification={
            nextCriticalMiddleware:'NOT_EXPOSED_BY_STATIC_DEPLOYMENT_SHAPE',
            vitestCriticalUiServer:result.vitestUiRefs.length?'REVIEW_REQUIRED':'NOT_EXPOSED_BY_REPO_SCRIPTS',
            pdfjsMaliciousPdf:result.pdfjsSourceRefs.length&&result.pdfInputRefs.some(x=>/AbaCotacao/.test(x))?'ACTIVE_RUNTIME_PATH':'NOT_PROVEN_ACTIVE'
          };
          fs.writeFileSync('/tmp/runtime-advisory-final.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(!result.staticExport) throw new Error('Expected output: export');
          if(result.middlewareFiles.length) throw new Error('Middleware found');
          if(result.nextServerRefs.length) throw new Error('Next server-only primitive found');
          if(result.vitestUiRefs.length) throw new Error('Vitest UI/server reference found');
          if(result.classification.pdfjsMaliciousPdf!=='ACTIVE_RUNTIME_PATH') throw new Error('Expected active PDF.js path not proven');
          NODE
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: house-runtime-advisory-final
          path: /tmp/runtime-advisory-final.json
          retention-days: 7
      - name: Remove temporary final classifier
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-runtime-advisory-final-temp.yml
          git add .github/workflows/house-runtime-advisory-final-temp.yml
          git commit -m "audit(house): remove temporary final advisory classifier" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
