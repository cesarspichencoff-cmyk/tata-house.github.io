name: House authorization preservation temporary
on:
  push:
    branches: [feat/house-governanca-phase1]
    paths: [.github/workflows/house-authorization-preservation-temp.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Authorization preservation
        run: npx vitest run src/lib/cardapio/login-preservacao.test.ts src/lib/cardapio/governanca-contexto.test.ts
      - name: Full tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Diff hygiene
        run: git diff --check 6dc04827b195aaca9d4653618e5a40ca64a1a6f4...HEAD
      - name: Remove temporary proof
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-authorization-preservation-temp.yml
          git add .github/workflows/house-authorization-preservation-temp.yml
          git commit -m "test(house): remove temporary authorization preservation proof" || exit 0
          git push origin HEAD:feat/house-governanca-phase1
