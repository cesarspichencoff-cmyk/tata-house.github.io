name: House readonly evidence-ready check temporary
on:
  push:
    branches:
      - feat/house-governanca-phase1
    paths:
      - '.github/workflows/house-readonly-ready-check-temp.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase1
      - run: npm ci
      - run: npx vitest run src/lib/cardapio/governanca-readonly.test.ts src/lib/cardapio/governanca-planejador.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: |
          grep -q 'GOV_PLANEJADOR_EVIDENCIA_READY_V1' src/lib/cardapio/governanca-readonly.ts
          grep -q "window.parent.postMessage(ready, ORIGEM_GOVERNANCA_READONLY_V1)" src/lib/cardapio/governanca-readonly.ts
          git diff --check
