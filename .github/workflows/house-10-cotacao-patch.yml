name: House 10 Cotacao Patch

on:
  push:
    branches:
      - feat/tata-house-10-10-cotacao-hardening-20260916

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !startsWith(github.event.head_commit.message, '[house-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded cotacao hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/cardapio/cotacao.ts')
          s = p.read_text()

          marker = "export function parsearCotacao(texto: string, fornecedoresCustom: string[] = []): LinhaCotacao[] {"
          assert marker in s, 'parse marker not found'
          helper = r'''
function unidadeEstruturada(valor: string | undefined): string | null {
  const n = normalizar(valor ?? '').replace(/\s+/g, ' ');
  if (!n || n === 'nao informado' || n === 'nao informada' || n === 'n/a') return null;
  const mapa: Record<string, string> = {
    und: 'un', unid: 'un', unidade: 'un', bdj: 'bd', bandeja: 'bd', pacote: 'pct',
    pcte: 'pct', litro: 'lt', litros: 'lt', l: 'lt', caixa: 'cx', saco: 'sc',
    maco: 'mc', 'maco': 'mc', peca: 'pc',
  };
  const u = mapa[n] ?? n;
  return UNIDADES.has(u) ? u : null;
}

function precoEstruturado(valor: string | undefined): number {
  if (!valor) return 0;
  const limpo = valor.replace(/R\$/gi, '').replace(/\s+/g, '').trim();
  if (!limpo) return 0;
  if (/,\d{1,2}$/.test(limpo)) return Number(limpo.replace(/\./g, '').replace(',', '.'));
  const n = Number(limpo.replace(/[^0-9.\-]/g, ''));
  return Number.isFinite(n) ? n : 0;
}

/**
 * Formato canônico de integração/IA:
 * ID=... | FORNECEDOR=... | PRODUTO=... | UNIDADE_PRECO=KG | PRECO=39,98
 *
 * Metadado nunca vira nome de produto. Campo explícito vence heurística e
 * fornecedor é mantido separado do produto.
 */
function parsearLinhaEstruturada(
  linha: string,
  fornecedorConhecido: (s: string) => string | null,
): LinhaCotacao | null {
  const campos: Record<string, string> = {};
  for (const parte of linha.split('|')) {
    const pos = parte.indexOf('=');
    if (pos <= 0) continue;
    const chave = normalizar(parte.slice(0, pos)).replace(/\s+/g, '_');
    const valor = parte.slice(pos + 1).trim();
    if (chave && valor) campos[chave] = valor;
  }

  const produto = (campos.produto ?? campos.item ?? campos.nome ?? '').trim();
  const preco = precoEstruturado(campos.preco);
  if (!produto || !(preco > 0)) return null;

  const fornecedorRaw = (campos.fornecedor ?? '').trim();
  const marcaRaw = (campos.marca ?? '').trim();
  let marca: string | null = null;
  if (fornecedorRaw && !ehRemetenteInterno(fornecedorRaw)) {
    marca = fornecedorConhecido(fornecedorRaw) ?? fornecedorRaw;
  } else if (marcaRaw && !ehRemetenteInterno(marcaRaw)) {
    marca = fornecedorConhecido(marcaRaw) ?? marcaRaw;
  }

  const estadoRaw = (campos.conservacao ?? campos.estado ?? '').trim();
  const estadoNorm = normalizar(estadoRaw);
  const estadoVisivel = /^(rf|resf|resfriado|resfriada|cg|cong|congelado|congelada)$/.test(estadoNorm)
    ? estadoRaw.toUpperCase()
    : '';
  const nome = estadoVisivel && !normalizar(produto).endsWith(estadoNorm)
    ? `${produto} ${estadoVisivel}`
    : produto;

  const unid = unidadeEstruturada(campos.unidade_preco ?? campos.unidade ?? campos.unid);
  return validarLinha({ nome, preco, marca, unid, item: casarItem(nome) });
}

'''
          s = s.replace(marker, helper + marker, 1)

          old = """    const linhaLimpa = limparLinha(bruta);\n    if (!linhaLimpa || linhaLimpa.length < 2) continue;\n\n    // Quebra linhas multi-item (\"A KG 1,00 B KG 2,00\") em uma por item.\n"""
          new = """    const linhaLimpa = limparLinha(bruta);\n    if (!linhaLimpa || linhaLimpa.length < 2) continue;\n\n    // Linhas de documentação nunca viram produto só porque contêm um preço de exemplo.\n    if (/^(importante|legenda|observa(?:cao|ção)|obs)\\s*[:\\-]/i.test(linhaLimpa)) continue;\n\n    // Arquivo estruturado: interpreta campos explicitamente e nunca transforma\n    // ID/FORNECEDOR/CATEGORIA em nome do produto. Se a linha parece estruturada\n    // mas está incompleta, ela é ignorada em vez de cair na heurística textual.\n    const pareceEstruturada = /(?:^|\\|)\\s*(?:id|fornecedor|produto|item|nome|preco|unidade_preco)\\s*=/i.test(linhaLimpa);\n    if (pareceEstruturada) {\n      const estruturada = parsearLinhaEstruturada(linhaLimpa, fornecedorConhecido);\n      if (estruturada) linhas.push(estruturada);\n      continue;\n    }\n\n    // Quebra linhas multi-item (\"A KG 1,00 B KG 2,00\") em uma por item.\n"""
          assert old in s, 'structured insertion point not found'
          s = s.replace(old, new, 1)

          old_group = """    } else {\n      atual.ofertas++;\n      if (l.preco < atual.preco) {\n        atual.preco = l.preco;\n        atual.marca = l.marca;\n        atual.precoHistorico = l.precoHistorico;\n        atual.deltaHistorico = l.deltaHistorico;\n        atual.confianca = l.confianca;\n        atual.alerta = l.alerta;\n        atual.bloqueado = l.bloqueado;\n        atual.origemHistorico = l.origemHistorico;\n      }\n    }\n"""
          new_group = """    } else {\n      atual.ofertas++;\n      // Uma oferta bloqueada por unidade incompatível jamais pode derrubar uma\n      // oferta válida só por parecer mais barata (ex.: CX 2,00 vs KG 7,40).\n      // Primeiro escolhemos segurança dimensional; só depois menor preço.\n      const atualBloqueado = !!atual.bloqueado;\n      const novoBloqueado = !!l.bloqueado;\n      const deveTrocar = (atualBloqueado && !novoBloqueado)\n        || (atualBloqueado === novoBloqueado && l.preco < atual.preco);\n      if (deveTrocar) {\n        atual.preco = l.preco;\n        atual.marca = l.marca;\n        atual.precoHistorico = l.precoHistorico;\n        atual.deltaHistorico = l.deltaHistorico;\n        atual.confianca = l.confianca;\n        atual.alerta = l.alerta;\n        atual.bloqueado = l.bloqueado;\n        atual.origemHistorico = l.origemHistorico;\n      }\n    }\n"""
          assert old_group in s, 'grouping block not found'
          s = s.replace(old_group, new_group, 1)
          p.write_text(s)

          t = Path('src/lib/cardapio/cotacao.test.ts')
          ts = t.read_text()
          ts = ts.replace(
            "import { parsearCotacao, ehRemetenteInterno, bloquearRemetente } from './cotacao';",
            "import { parsearCotacao, agruparCotacao, ehRemetenteInterno, bloquearRemetente } from './cotacao';",
            1,
          )
          extra = r'''

describe('cotação — formato estruturado e seleção dimensional segura', () => {
  it('lê campos estruturados sem transformar metadados em nome de produto', () => {
    const [linha] = parsearCotacao('ID=0020 | FORNECEDOR=WG | CATEGORIA=BOVINOS | PRODUTO=Tiras de carnes | UNIDADE_PRECO=KG | PRECO=39,98');
    expect(linha).toBeDefined();
    expect(linha.nome).toBe('Tiras de carnes');
    expect(linha.marca).toBe('WG');
    expect(linha.item).toBe('Tiras de Carne');
    expect(linha.unid).toBe('kg');
    expect(linha.preco).toBeCloseTo(39.98, 2);
  });

  it('ignora linha estruturada incompleta em vez de cadastrar metadata como produto', () => {
    const linhas = parsearCotacao('ID=0001 | FORNECEDOR=WG | PRECO=39,98');
    expect(linhas).toHaveLength(0);
  });

  it('ignora cabeçalho IMPORTANTE com preço de exemplo', () => {
    const linhas = parsearCotacao('IMPORTANTE: exemplo de preço 39,98');
    expect(linhas).toHaveLength(0);
  });

  it('oferta incompatível mais barata não substitui oferta válida do mesmo item', () => {
    const linhas = parsearCotacao('ABACAXI CX 2,00\nABACAXI KG 7,40');
    const item = agruparCotacao(linhas).casados.find((x) => x.item.toLowerCase().includes('abacaxi'));
    expect(item).toBeDefined();
    expect(item!.ofertas).toBe(2);
    expect(item!.bloqueado).toBeFalsy();
    expect(item!.preco).toBeCloseTo(7.40, 2);
  });
});
'''
          assert "formato estruturado e seleção dimensional segura" not in ts
          t.write_text(ts.rstrip() + extra + '\n')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cardapio/cotacao.ts src/lib/cardapio/cotacao.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "[house-patch] fix(cotacao): estrutura campos e protege unidades"
          git push origin HEAD:feat/tata-house-10-10-cotacao-hardening-20260916
