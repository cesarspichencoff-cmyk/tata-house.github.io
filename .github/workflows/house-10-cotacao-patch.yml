name: House 10 Cotacao Hardening

on:
  push:
    branches:
      - feat/tata-house-10-10-cotacao-hardening-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded hardening
        run: python scripts/house10_cotacao_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cardapio/cotacao.ts src/lib/cardapio/cotacao.test.ts
          if git diff --cached --quiet; then
            echo "No patch delta to persist"
            exit 0
          fi
          git commit -m "[house-patch] fix(cotacao): separa oferta, produto e unidade"
          git push origin HEAD:feat/tata-house-10-10-cotacao-hardening-20260916
