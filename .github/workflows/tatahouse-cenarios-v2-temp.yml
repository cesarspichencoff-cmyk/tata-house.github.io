name: TATÁ House cenários V2 (temp)

on:
  push:
    branches:
      - feat/house-governanca-phase1
    paths:
      - 'src/lib/cardapio/governanca-candidatos.ts'
      - 'src/lib/cardapio/governanca-candidatos.test.ts'
      - 'src/components/cardapio/CenariosGovernanca.tsx'
      - 'src/components/cardapio/PlanejadorGovernanca.tsx'
      - '.github/workflows/tatahouse-cenarios-v2-temp.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
