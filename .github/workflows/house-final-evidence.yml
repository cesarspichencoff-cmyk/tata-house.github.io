name: House Final Evidence Fix

on:
  push:
    branches:
      - feat/tata-house-10-10-consolidation-20260916
    paths:
      - scripts/house10_integrity_patch.py

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply evidence patch
        run: python scripts/house10_integrity_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Persist verified evidence patch
        run: |
          git config user.name "TATA House CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cardapio/inteligencia-viva.ts src/lib/cardapio/inteligencia-viva.test.ts
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "[house-final] fix(relatorios): NF comprovada exige origem fiscal"
            git push
          fi
