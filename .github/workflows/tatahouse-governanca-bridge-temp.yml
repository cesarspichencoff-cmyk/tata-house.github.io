name: TATA House governance bridge final shadow gate

on:
  push:
    branches: [feat/house-governanca-phase2]
    paths:
      - 'src/app/governanca-bridge/page.tsx'
      - '.github/workflows/tatahouse-governanca-bridge-temp.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify exported bridge
        run: |
          test -f out/governanca-bridge.html
          grep -F 'ponte de leitura para Governança' out/governanca-bridge.html
          git diff --check
